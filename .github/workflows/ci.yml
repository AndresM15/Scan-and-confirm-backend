# CI: revisa build, lint y tests en cada PR hacia QA (SCRUM-28).
# El job "Build, lint y tests" es el check obligatorio para hacer merge en QA.
name: CI

on:
  pull_request:
    branches: [QA]
  push:
    branches: [QA]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Build, lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El cliente de Prisma no siempre se genera en npm ci; sin él fallan build y tests
      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      # Usan Prisma simulado: no necesitan base de datos
      - name: Tests e2e
        run: npm run test:e2e
